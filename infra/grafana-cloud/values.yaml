cluster:
  name: k3s

collectorCommon:
  alloy:
    remoteConfig:
      enabled: true
      url: https://fleet-management-prod-014.grafana.net
      auth:
        type: basic
        username: "1922292"
        passwordFrom: 'sys.env("GCLOUD_RW_API_KEY")'

telemetryServices:
  beyla:
    deploy: false
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
  opencost:
    deploy: false
  sdkInjector:
    deploy: false

collectors:
  alloy:
    extraService:
      enabled: true
      name: otel-receiver
    presets:
      - large
      - root
      - host-network
      - host-storage
      - host-cgroup
      - clustered
      - service-discovery
      - filesystem-log-reader
      - daemonset
      - otel-receiver
    alloy:
      extraEnv:
        - name: GCLOUD_RW_API_KEY
          valueFrom:
            secretKeyRef:
              name: grafana-cloud-auth
              key: password

selfReporting:
  enabled: false
