cluster:
  name: k3s

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-67-prod-us-west-0.grafana.net/api/prom/push
    auth:
      type: basic
    secret:
      create: false
      name: grafana-cloud-prom-auth
      namespace: monitoring
  grafana-cloud-logs:
    type: loki
    url: https://logs-prod-021.grafana.net/loki/api/v1/push
    auth:
      type: basic
    secret:
      create: false
      name: grafana-cloud-loki-auth
      namespace: monitoring

clusterMetrics:
  enabled: true

podLogs:
  enabled: true

telemetryServices:
  beyla:
    deploy: false
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
  opencost:
    deploy: false
  sdkInjector:
    deploy: false

collectors:
  alloy:
    presets:
      - clustered
      - daemonset
      - large
      - root
      - host-network
      - host-storage
      - host-cgroup
      - service-discovery
      - filesystem-log-reader
      - otel-receiver

alloy-operator:
  leaderElection:
    enabled: false

selfReporting:
  enabled: false
