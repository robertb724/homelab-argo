apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-cloud-prom-auth
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-cloud-prom-auth
    creationPolicy: Owner
    template:
      data:
        username: "3768794"
        password: "{{ .grafanaToken }}"
  data:
  - secretKey: grafanaToken
    remoteRef:
      key: grafana-token
