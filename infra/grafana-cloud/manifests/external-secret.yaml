apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-cloud-auth
  namespace: grafana-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: grafana-cloud-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: grafana-token
        version: latest
